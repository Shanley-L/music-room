services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    ports:
      - target: 5432
        published: 5433
        protocol: tcp
        mode: host
      - target: 3000
        published: 3000
        protocol: tcp
        mode: host
    environment:
      POSTGRES_USER: musicroom
      POSTGRES_PASSWORD: musicroom
      POSTGRES_DB: musicroom
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musicroom -d musicroom"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/library/redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: ./Api
    network_mode: "service:postgres"
    volumes:
      - ./Api:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - DATABASE_URL=postgresql://musicroom:musicroom@127.0.0.1:5432/musicroom
      - REDIS_URL=redis://127.0.0.1:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: npm run dev

  app:
    build:
      context: ./App
    ports:
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
      - "8081:8081"
    volumes:
      - ./App:/app
      - /app/node_modules
    environment:
      - EXPO_DEBUG=true
    tty: true
    command: npm start

volumes:
  postgres_data: