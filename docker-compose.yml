services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: musicroom
      POSTGRES_PASSWORD: musicroom
      POSTGRES_DB: musicroom
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: docker.io/library/redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: ./Api
    ports:
      - "3000:3000"
    volumes:
      - ./Api:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - DATABASE_URL=postgresql://musicroom:musicroom@postgres:5432/musicroom
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    command: sh -c "until npx prisma db push; do echo 'Waiting for database...'; sleep 2; done && npm run dev"

  app:
    build:
      context: ./App
    ports:
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
      - "8081:8081"
    volumes:
      - ./App:/app
      - /app/node_modules
    environment:
      - EXPO_DEBUG=true
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    tty: true
    command: npm start

volumes:
  postgres_data: